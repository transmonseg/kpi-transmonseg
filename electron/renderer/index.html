<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>KPI TransMonSeg</title>
    <style>
      :root {
        --bg: #0b1220; --panel: #131c2e; --panel-2: #0f1726; --line: #243049;
        --txt: #e6edf6; --muted: #94a3b8; --brand: #38bdf8; --ok: #34d399; --err: #f87171; --warn: #fbbf24;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--txt); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
      header { padding: 18px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
      header h1 { font-size: 18px; margin: 0; font-weight: 650; }
      header .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); padding: 2px 8px; border-radius: 999px; }
      main { padding: 24px; max-width: 920px; margin: 0 auto; display: grid; gap: 18px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
      .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 12px; }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      button { background: var(--panel-2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
      button:hover { border-color: var(--brand); }
      button.primary { background: var(--brand); color: #06121d; border-color: var(--brand); font-weight: 650; }
      button.primary:disabled { opacity: .5; cursor: not-allowed; }
      input[type="date"] { background: var(--panel-2); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
      .files { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
      .files b { color: var(--txt); }
      .status { font-size: 12px; color: var(--muted); }
      .pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
      .pill.ok { color: var(--ok); border-color: #1f7a5a; }
      .pill.pend { color: var(--warn); border-color: #7a5d1f; }
      #resultado { display: grid; gap: 8px; }
      .rede { display: flex; justify-content: space-between; padding: 8px 12px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
      .msg { padding: 10px 12px; border-radius: 8px; font-size: 13px; }
      .msg.ok { background: rgba(52,211,153,.1); border: 1px solid #1f7a5a; color: var(--ok); }
      .msg.err { background: rgba(248,113,113,.1); border: 1px solid #7a2a2a; color: var(--err); }
      .muted { color: var(--muted); }
      ul.fila { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
      ul.fila li { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 6px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; }
    </style>
  </head>
  <body>
    <header>
      <h1>KPI TransMonSeg</h1>
      <span class="tag">app offline</span>
      <span id="cadastro-status" class="status" style="margin-left:auto"></span>
    </header>
    <main>
      <div class="card">
        <h2>1 · Arquivos</h2>
        <div class="row">
          <button id="btn-escala">Escolher escala(s)…</button>
          <button id="btn-unitrac">Escolher Unitrac…</button>
        </div>
        <div class="files" id="files-escala">Nenhuma escala selecionada.</div>
        <div class="files" id="files-unitrac">Nenhum Unitrac selecionado.</div>
      </div>

      <div class="card">
        <h2>2 · Data e geração</h2>
        <div class="row">
          <label class="muted">Data do KPI: <input type="date" id="data" /></label>
          <button id="btn-gerar" class="primary" disabled>Gerar KPI offline</button>
        </div>
        <div id="msg"></div>
        <div id="resultado"></div>
      </div>

      <div class="card">
        <h2>3 · Fila de envio <button id="btn-sync" style="float:right;font-size:12px;padding:4px 10px">Sincronizar agora</button></h2>
        <ul class="fila" id="fila"><li class="muted">Vazia.</li></ul>
        <div id="sync-msg" class="status" style="margin-top:8px"></div>
      </div>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
