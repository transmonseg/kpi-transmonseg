appId: br.com.transmonseg.kpi
productName: KPI TransMonSeg
copyright: TRANSMONSEG

directories:
  output: release
  buildResources: electron/build-resources

# Copia o standalone do Next (com node_modules) DEPOIS do empacotamento — o
# electron-builder não copia node_modules via extraResources (ver afterPack.cjs).
afterPack: electron/afterPack.cjs

# O que entra no app empacotado: o bundle do Electron (main/preload) + package.json.
# A interface é o site Next REAL, empacotado em build standalone e colocado em
# resources/standalone (server.js + .next + node_modules + static/public). O
# Electron sobe esse servidor local e carrega /painel.
files:
  - electron/dist/**/*
  - package.json

extraResources:
  - from: src/assets
    to: assets
# O site Next real (resources/standalone) é copiado pelo afterPack.cjs — o
# electron-builder não copia o node_modules dele via extraResources.

win:
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: KPI TransMonSeg
